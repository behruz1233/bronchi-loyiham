
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Behruz | Shaxsiy havolalar</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #101827, #702963, #e1306c);
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 30px 24px;
      text-align: center;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      box-shadow: 0 12px 35px #0004;
    }

    .avatar {
      width: 95px;
      height: 95px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcc70, #e1306c, #833ab4);
      border: 3px solid white;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #f3e8ff;
      line-height: 1.6;
    }

    .link {
      display: block;
      padding: 15px;
      margin-top: 14px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .link:hover {
      transform: translateY(-3px);
      opacity: 0.9;
    }

    .instagram {
      background: linear-gradient(90deg, #f9ce34, #ee2a7b, #6228d7);
    }

    .telegram {
      background: #229ed9;
    }

    .phone {
      background: #16a34a;
    }

    small {
      display: block;
      margin-top: 25px;
      color: #eee;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar">B</div>

    <h1>Behruz</h1>
    <p>Shaxsiy sahifamga xush kelibsiz! 👋</p>

    <a class="link instagram"
       href="https://instagram.com/INSTAGRAM_USERNAME"
       target="_blank" rel="noopener noreferrer">
      📸 Instagram
    </a>

    <a class="link telegram"
       href="https://t.me/axrorivic_1"
       target="_blank" rel="noopener noreferrer">
      ✈️ Telegram
    </a>

    <a class="link phone" href="tel:+998901234567">
      ☎️ Telefon qilish
    </a>

    <small>© 2026 | Mening shaxsiy sahifam</small>
  </main>
</body>
</html>
